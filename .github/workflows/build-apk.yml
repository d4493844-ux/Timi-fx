name: Build TIMI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies
        run: npm install

      - name: Build React app
        run: |
          cd timi/frontend
          CI=false npm install
          CI=false npm run build

      - name: Setup Capacitor and Android
        run: |
          cd timi/frontend
          npm install @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android
          npx cap add android
          npx cap sync android
          ls android/gradlew && echo "gradlew found!" || echo "gradlew missing!"

      - name: Set TIMI App Icon
        run: |
          cd timi/frontend
          # Install imagemagick for icon resizing
          sudo apt-get install -y imagemagick wget
          # Download TIMI logo
          wget -O timi-logo.jpg "https://res.cloudinary.com/drefakuj9/image/upload/v1772314893/WhatsApp_Image_2026-02-28_at_10.27.28_PM_ylndjq.jpg"
          # Generate all required Android icon sizes
          ICON_DIR="android/app/src/main/res"
          convert timi-logo.jpg -resize 48x48   $ICON_DIR/mipmap-mdpi/ic_launcher.png
          convert timi-logo.jpg -resize 72x72   $ICON_DIR/mipmap-hdpi/ic_launcher.png
          convert timi-logo.jpg -resize 96x96   $ICON_DIR/mipmap-xhdpi/ic_launcher.png
          convert timi-logo.jpg -resize 144x144 $ICON_DIR/mipmap-xxhdpi/ic_launcher.png
          convert timi-logo.jpg -resize 192x192 $ICON_DIR/mipmap-xxxhdpi/ic_launcher.png
          # Round icons too
          convert timi-logo.jpg -resize 48x48   $ICON_DIR/mipmap-mdpi/ic_launcher_round.png
          convert timi-logo.jpg -resize 72x72   $ICON_DIR/mipmap-hdpi/ic_launcher_round.png
          convert timi-logo.jpg -resize 96x96   $ICON_DIR/mipmap-xhdpi/ic_launcher_round.png
          convert timi-logo.jpg -resize 144x144 $ICON_DIR/mipmap-xxhdpi/ic_launcher_round.png
          convert timi-logo.jpg -resize 192x192 $ICON_DIR/mipmap-xxxhdpi/ic_launcher_round.png
          echo "Icons set!"

      - name: Add WakeLock Permission to AndroidManifest
        run: |
          cd timi/frontend/android/app/src/main
          # Add wake lock permission
          sed -i 's/<uses-permission android:name="android.permission.INTERNET"\/>/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"\/>/' AndroidManifest.xml
          echo "Permissions added!"
          cat AndroidManifest.xml | grep permission

      - name: Set TIMI App Icon
        run: |
          sudo apt-get install -y imagemagick 2>/dev/null || true
          curl -L "https://res.cloudinary.com/drefakuj9/image/upload/v1772314893/WhatsApp_Image_2026-02-28_at_10.27.28_PM_ylndjq.jpg" -o /tmp/timi-logo.jpg
          ICON_DIR="timi/frontend/android/app/src/main/res"
          for SIZE_DIR in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$ICON_DIR/$SIZE_DIR"
          done
          convert /tmp/timi-logo.jpg -resize 48x48   "$ICON_DIR/mipmap-mdpi/ic_launcher.png"
          convert /tmp/timi-logo.jpg -resize 72x72   "$ICON_DIR/mipmap-hdpi/ic_launcher.png"
          convert /tmp/timi-logo.jpg -resize 96x96   "$ICON_DIR/mipmap-xhdpi/ic_launcher.png"
          convert /tmp/timi-logo.jpg -resize 144x144 "$ICON_DIR/mipmap-xxhdpi/ic_launcher.png"
          convert /tmp/timi-logo.jpg -resize 192x192 "$ICON_DIR/mipmap-xxxhdpi/ic_launcher.png"
          convert /tmp/timi-logo.jpg -resize 48x48   "$ICON_DIR/mipmap-mdpi/ic_launcher_round.png"
          convert /tmp/timi-logo.jpg -resize 72x72   "$ICON_DIR/mipmap-hdpi/ic_launcher_round.png"
          convert /tmp/timi-logo.jpg -resize 96x96   "$ICON_DIR/mipmap-xhdpi/ic_launcher_round.png"
          convert /tmp/timi-logo.jpg -resize 144x144 "$ICON_DIR/mipmap-xxhdpi/ic_launcher_round.png"
          convert /tmp/timi-logo.jpg -resize 192x192 "$ICON_DIR/mipmap-xxxhdpi/ic_launcher_round.png"
          convert /tmp/timi-logo.jpg -resize 108x108 "$ICON_DIR/mipmap-mdpi/ic_launcher_foreground.png"
          convert /tmp/timi-logo.jpg -resize 162x162 "$ICON_DIR/mipmap-hdpi/ic_launcher_foreground.png"
          convert /tmp/timi-logo.jpg -resize 216x216 "$ICON_DIR/mipmap-xhdpi/ic_launcher_foreground.png"
          convert /tmp/timi-logo.jpg -resize 324x324 "$ICON_DIR/mipmap-xxhdpi/ic_launcher_foreground.png"
          convert /tmp/timi-logo.jpg -resize 432x432 "$ICON_DIR/mipmap-xxxhdpi/ic_launcher_foreground.png"
          echo "Icons set!"

      - name: Build Debug APK
        run: |
          cd timi/frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIMI-debug-apk
          path: timi/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
