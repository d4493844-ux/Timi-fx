name: Build TIMI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install root dependencies
        run: npm install

      - name: Build React app
        run: cd timi/frontend && CI=false npm install && CI=false npm run build

      - name: Install Capacitor
        run: |
          cd timi/frontend
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x timi/frontend/android/gradlew

      - name: Build Debug APK
        run: |
          cd timi/frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: TIMI-debug
          path: timi/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Get APK size
        run: |
          ls -lh timi/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          echo "✅ APK built successfully!"
